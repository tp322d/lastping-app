<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="LastPing — the dead man's switch for everything that runs without you">
  <title>LastPing</title>
  <style>
    /* Rendered through an img tag on GitHub, so it must carry its own type and
       colour. The media query follows the reader's system theme, which is what
       GitHub's own auto theme follows too.

       No block characters and no box drawing: the first version of this banner
       was ASCII art, and GitHub's monospace renders full blocks at inconsistent
       widths and refuses to join box-drawing corners, so the wordmark came out
       as noise. Type is type. */
    .paper { fill: #faf9f7; }
    .ink   { fill: #1c1b19; }
    .muted { fill: #6b6862; }
    .trace { stroke: #d9d4cb; }
    .beat  { stroke: #0f766e; }
    .flat  { stroke: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #14130f; }
      .ink   { fill: #f0ede8; }
      .muted { fill: #a39d93; }
      .trace { stroke: #34322d; }
      .beat  { stroke: #2dd4bf; }
      .flat  { stroke: #f87171; }
    }
    .wordmark {
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 96px;
      font-weight: 700;
      letter-spacing: 6px;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 25px;
    }
    .label {
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 17px;
      letter-spacing: 1.5px;
    }
    .line { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }

    /* The pulse travels, then the run stops and the line goes flat and red --
       the product's whole premise in six seconds. */
    .beat  { animation: run 6s linear infinite; }
    .flat  { animation: stop 6s linear infinite; }
    /* The crossfade is deliberately near-instant. Interpolating over several
       percent leaves the red flatline and the teal beat both half-opaque, which
       reads as two overlapping lines rather than one line changing state.
       At 0% the trace is beating and the flatline is hidden, so the first frame
       is also the correct still image if the animation never runs. */
    @keyframes run  { 0%,57% { opacity: 1 } 58%,88% { opacity: 0 } 89%,100% { opacity: 1 } }
    @keyframes stop { 0%,57% { opacity: 0 } 58%,88% { opacity: 1 } 89%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .beat { animation: none; opacity: 1 }
      .flat { animation: none; opacity: 0 }
    }
  </style>

  <rect class="paper" width="1200" height="320" rx="14"/>

  <text class="wordmark ink" x="80" y="132">LastPing</text>

  <!-- baseline, then the beating trace over it -->
  <path class="line trace" d="M80 208 H1120"/>
  <path class="line beat"
        d="M80 208 H300 l16 -34 l14 68 l12 -34 H560 l16 -34 l14 68 l12 -34 H820 l16 -34 l14 68 l12 -34 H1120"/>
  <path class="line flat" d="M80 208 H1120"/>

  <text class="tag muted" x="80" y="268">The dead man's switch for everything that runs without you.</text>
  <text class="label muted" x="80" y="300">CRON · BACKUPS · CI/CD · AI AGENTS</text>
</svg>
